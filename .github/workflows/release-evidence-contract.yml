name: Release Evidence Contract

on:
  pull_request:
    branches:
      - Yume
      - Dev
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "README.md"
      - "RELEASE_STUDY.md"
      - "gradle.properties"
      - "release-health-v*.md"
      - "docs/**"
      - "scripts/*.ps1"
  push:
    branches:
      - Yume
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "README.md"
      - "RELEASE_STUDY.md"
      - "gradle.properties"
      - "release-health-v*.md"
      - "docs/**"
      - "scripts/*.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate Release Evidence
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Parse PowerShell report scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          $scripts = @(Get-ChildItem -Path scripts -Filter *.ps1)
          foreach ($script in $scripts) {
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List *
            exit 1
          }
          "Parsed $($scripts.Count) PowerShell scripts."

      - name: Run study APK contract
        shell: pwsh
        run: |
          $jsonOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.json"
          $markdownOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.md"
          ./scripts/study-apk-contract.ps1 -JsonOut $jsonOut -MarkdownOut $markdownOut

      - name: Assert study APK contract report
        shell: pwsh
        run: |
          $jsonOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.json"
          if (-not (Test-Path -LiteralPath $jsonOut)) {
            throw "study APK contract JSON was not generated: $jsonOut"
          }

          $report = Get-Content -LiteralPath $jsonOut -Raw | ConvertFrom-Json
          if (-not [bool]$report.ok) {
            $failures = @($report.failures | ForEach-Object { "- $($_.name): $($_.detail)" })
            throw "study APK contract failed:`n$($failures -join "`n")"
          }

          $checkCount = @($report.checks).Count
          if ($checkCount -lt 200) {
            throw "study APK contract produced too few checks: $checkCount"
          }

          "Validated study APK contract: tag=$($report.tag), checks=$checkCount"

      - name: Upload study APK contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: study-apk-contract-report
          path: |
            ${{ runner.temp }}/study-apk-contract.json
            ${{ runner.temp }}/study-apk-contract.md
          if-no-files-found: error
