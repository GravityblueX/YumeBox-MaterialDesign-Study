name: Release Evidence Contract

on:
  pull_request:
    branches:
      - Yume
      - Dev
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "README.md"
      - "RELEASE_STUDY.md"
      - "gradle.properties"
      - "release-health-v*.md"
      - "docs/**"
      - "scripts/*.ps1"
  push:
    branches:
      - Yume
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "README.md"
      - "RELEASE_STUDY.md"
      - "gradle.properties"
      - "release-health-v*.md"
      - "docs/**"
      - "scripts/*.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate Release Evidence
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Parse PowerShell report scripts
        shell: pwsh
        run: |
          $parseFailures = [System.Collections.Generic.List[object]]::new()
          $scripts = @(Get-ChildItem -Path scripts -Filter *.ps1)
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              $parseFailures.Add([pscustomobject]@{
                path = $script.FullName
                message = $parseError.Message
                startLineNumber = $parseError.Extent.StartLineNumber
                startColumnNumber = $parseError.Extent.StartColumnNumber
              }) | Out-Null
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | Format-List *
            exit 1
          }
          "Parsed $($scripts.Count) PowerShell scripts."

      - name: Run study APK contract
        shell: pwsh
        run: |
          $jsonOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.json"
          $markdownOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.md"
          ./scripts/study-apk-contract.ps1 -JsonOut $jsonOut -MarkdownOut $markdownOut

      - name: Assert study APK contract report
        shell: pwsh
        run: |
          $jsonOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.json"
          $markdownOut = Join-Path $env:RUNNER_TEMP "study-apk-contract.md"
          if (-not (Test-Path -LiteralPath $jsonOut)) {
            throw "study APK contract JSON was not generated: $jsonOut"
          }
          if (-not (Test-Path -LiteralPath $markdownOut)) {
            throw "study APK contract Markdown was not generated: $markdownOut"
          }

          $report = Get-Content -LiteralPath $jsonOut -Raw | ConvertFrom-Json
          if ([string]$report.reportType -ne "study_apk_contract") {
            throw "study APK contract JSON had unexpected reportType: $($report.reportType)"
          }

          if (-not [bool]$report.ok) {
            $failures = @($report.failures | ForEach-Object { "- $($_.name): $($_.detail)" })
            throw "study APK contract failed:`n$($failures -join "`n")"
          }

          $checkCount = @($report.checks).Count
          if ([int]$report.summary.checkCount -ne $checkCount) {
            throw "study APK contract summary check count does not match checks array: summary=$($report.summary.checkCount), checks=$checkCount"
          }
          $failureCount = @($report.failures).Count
          $failedChecks = @($report.checks | Where-Object { -not [bool]$_.ok })
          if ([int]$report.summary.failureCount -ne $failedChecks.Count -or $failureCount -ne $failedChecks.Count) {
            throw "study APK contract failure count does not match failed checks: summary=$($report.summary.failureCount), failures=$failureCount, failedChecks=$($failedChecks.Count)"
          }
          if ($failedChecks.Count -ne 0) {
            throw "study APK contract recorded failures despite ok=true: failedChecks=$($failedChecks.Count)"
          }

          if ($checkCount -lt 190) {
            throw "study APK contract produced too few checks: $checkCount"
          }

          $nonBooleanCheckOkValues = @($report.checks | Where-Object {
            $null -eq $_.ok -or $_.ok.GetType().FullName -ne "System.Boolean"
          })
          if ($nonBooleanCheckOkValues.Count -gt 0) {
            throw "non-boolean study APK contract check ok values: $($nonBooleanCheckOkValues.Count)"
          }

          $blankCheckNames = @($report.checks | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.name) })
          if ($blankCheckNames.Count -gt 0) {
            throw "blank study APK contract check names: $($blankCheckNames.Count)"
          }
          $duplicateCheckNames = @(
            $report.checks |
              Group-Object -Property name |
              Where-Object { $_.Count -gt 1 } |
              ForEach-Object { [string]$_.Name }
          )
          if ($duplicateCheckNames.Count -gt 0) {
            throw "duplicate study APK contract check names: $($duplicateCheckNames -join ', ')"
          }

          $markdown = Get-Content -LiteralPath $markdownOut -Raw
          $expectedTitle = "# Study APK Contract - $($report.tag)"
          if (-not $markdown.StartsWith($expectedTitle)) {
            throw "study APK contract Markdown title does not match JSON tag: $expectedTitle"
          }
          if ($markdown -notmatch '(?m)^Status:\s+`OK`$') {
            throw "study APK contract Markdown did not record OK status"
          }
          if ($markdown -notmatch '(?m)^## Summary$') {
            throw "study APK contract Markdown did not include a summary section"
          }
          $expectedCheckCountRow = "| Check count | $checkCount |"
          if (-not $markdown.Contains($expectedCheckCountRow)) {
            throw "study APK contract Markdown check count does not match JSON: $expectedCheckCountRow"
          }
          $expectedFailureCountRow = "| Failure count | 0 |"
          if (-not $markdown.Contains($expectedFailureCountRow)) {
            throw "study APK contract Markdown failure count does not match JSON: $expectedFailureCountRow"
          }

          "Validated study APK contract: tag=$($report.tag), checks=$checkCount"

      - name: Upload study APK contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: study-apk-contract-report
          path: |
            ${{ runner.temp }}/study-apk-contract.json
            ${{ runner.temp }}/study-apk-contract.md
          if-no-files-found: error
